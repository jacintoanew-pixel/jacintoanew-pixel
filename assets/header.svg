<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="100%" height="100%" role="img" aria-label="Jacinto Josué Santo Atencio">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="ambient" cx="15%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Card Surface -->
  <rect x="0.5" y="0.5" width="1199" height="247" rx="16" fill="url(#surface)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="1199" height="247" rx="16" fill="url(#ambient)"/>

  <!-- Specular Top Hairline (Apple Material Edge) -->
  <line x1="16" y1="1" x2="1184" y2="1" stroke="url(#topEdge)" stroke-width="1"/>

  <!-- Typography Block (Optical Sizing + Negative Tracking on Display) -->
  <g transform="translate(52, 50)">
    <!-- Eyebrow Metadata -->
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
          font-size="13"
          font-weight="500"
          letter-spacing="0.01em"
          fill="#86868b">
      V-Rax Company  ·  Santiago, Panamá
    </text>

    <!-- Display Heading -->
    <text x="-1" y="42"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-size="38"
          font-weight="700"
          letter-spacing="-0.026em"
          fill="#f5f5f7">
      Jacinto Josué Santo Atencio
    </text>

    <!-- Lead Subtitle -->
    <text x="0" y="74"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-size="18"
          font-weight="400"
          letter-spacing="-0.012em"
          fill="#a1a1a6">
      Analista de Seguridad, Administración de Servidores Linux y Desarrollo Web
    </text>

    <!-- Hairline Divider -->
    <line x1="0" y1="108" x2="1096" y2="108" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Structured 3-Column Metadata (Weight + Contrast Hierarchy) -->
    <g transform="translate(0, 136)">
      <!-- Column 1 -->
      <text x="0" y="0"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
            font-size="11.5"
            font-weight="500"
            letter-spacing="0.02em"
            fill="#6e6e73">
        FORMACIÓN
      </text>
      <text x="0" y="21"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
            font-size="14"
            font-weight="500"
            letter-spacing="-0.008em"
            fill="#e5e5ea">
        Lic. en Ciberseguridad · UTP
      </text>

      <!-- Column 2 -->
      <text x="340" y="0"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
            font-size="11.5"
            font-weight="500"
            letter-spacing="0.02em"
            fill="#6e6e73">
        MARCOS DE SEGURIDAD
      </text>
      <text x="340" y="21"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
            font-size="14"
            font-weight="500"
            letter-spacing="-0.008em"
            fill="#e5e5ea">
        CIS Controls v8 · NIST · ISO/IEC 27001
      </text>

      <!-- Column 3 -->
      <text x="720" y="0"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
            font-size="11.5"
            font-weight="500"
            letter-spacing="0.02em"
            fill="#6e6e73">
        RECONOCIMIENTO
      </text>
      <text x="720" y="21"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
            font-size="14"
            font-weight="500"
            letter-spacing="-0.008em"
            fill="#e5e5ea">
        2.º Lugar · OEA Cyber Challenger 2026
      </text>
    </g>
